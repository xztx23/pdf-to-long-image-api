name: PDF转长图
on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: 'PDF文件直链'
        required: true

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖（poppler）
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: 设置Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行转换脚本
        run: python run.py
        env:
          PDF_URL: ${{ github.event.inputs.pdf_url }}
